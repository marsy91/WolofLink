# Weekly off-site backup of the Supabase database (docs/team/backups.md).
# Dumps roles, schema and data with the Supabase CLI, encrypts them, and keeps the encrypted
# file as a workflow artifact for 90 days. The repo is public, so nothing unencrypted is ever
# stored or committed. Then it restores the dump into a throwaway database to prove it works.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the session pooler connection string, with the database password
#   BACKUP_PASSPHRASE   a long random passphrase; keep a copy in your password manager
# Until both are set, the job skips without failing.
name: Backup
on:
  schedule:
    - cron: "23 3 * * 0" # Sundays 03:23 UTC
  workflow_dispatch: {}
concurrency:
  group: backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Secrets set?
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup secrets not set yet (docs/team/backups.md); skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        if: steps.ready.outputs.go == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir dump && cd dump
          supabase db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"
          ls -l

      - name: Encrypt
        id: pack
        if: steps.ready.outputs.go == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          name="woloflink-db-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C dump roles.sql schema.sql data.sql
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm "$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name.tar.gz.gpg"

      - name: Keep the encrypted backup (90 days)
        if: steps.ready.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.name }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Check that the backup restores
        if: steps.ready.outputs.go == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          supabase init --workdir restore-check
          supabase db start --workdir restore-check
          psql --single-transaction --variable ON_ERROR_STOP=1 \
            --file dump/roles.sql --file dump/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file dump/data.sql \
            --dbname 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql -At 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -c "select 'auth users restored: ' || count(*) from auth.users"

      - name: Remove the unencrypted dump
        if: always()
        run: rm -rf "${{ runner.temp }}/dump"
